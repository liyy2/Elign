# Variant: stronger RDKit validity push (no repair) while keeping the MLFF-gating safety.
# - Increase invalid penalty scale.
# - Use `invalid_reward_gate_mode=min` to preserve an extra force-based penalty for
#   severely unstable invalid geometries without allowing invalid samples to be rewarded.
name: edm-geom-termforce-only-eadvwarmup-long-vxu-histlog-mm3-validitypush-v2

filters:
  invalid_penalty_scale: 2.0
  invalid_reward_gate_mode: min
