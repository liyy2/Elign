defaults:
  - ddpo_geom_energy_force_vxu_suffix
  - _self_

name: edm-geom-energy-force-vxu-suffix-tuned

best_checkpoint_metric: validity_x_uniqueness_x_stability
best_checkpoint_mode: max

dataloader:
  geom_data_file: geom_drugs_30.npy
  epoches: 1000000
  each_prompt_sample: 16
  micro_batch_size: 32
  nodes_dist_focus_min: 20
  nodes_dist_focus_max: 80
  nodes_dist_focus_multiplier: 3.0

model:
  skip_prefix: 700

train:
  learning_rate: 1.0e-06
  train_micro_batch_size: 16
  gradient_accumulation_steps: 4
  kl_penalty_weight: 0.04
  kl_adaptive: false
  early_stop_metric: validity_x_uniqueness_x_stability
  early_stop_mode: max
  early_stop_patience_minutes: 120
  early_stop_min_delta: 0.001

filters:
  invalid_penalty_scale: 0.45
  duplicate_penalty_scale: 0.60

reward:
  force_clip_threshold: 10.0
  force_only_if_stable: false
  stability_weight: 4.0
  atom_stability_weight: 10.0
  valence_underbond_weight: 0.10
  valence_overbond_weight: 0.10
  valence_underbond_soft_weight: 0.02
  valence_overbond_soft_weight: 0.02
  valence_soft_temperature: 0.02

save_interval: 10
