defaults:
  - _self_

name: edm-geom
seed: 42
save_path: null
resume: false
checkpoint_path: null
best_checkpoint_metric: molecule_stability
best_checkpoint_mode: max

dataloader:
  sample_group_size: 4
  each_prompt_sample: 128
  micro_batch_size: 256
  # Number of rollout/update iterations to run.
  epoches: 100
  # Optional: override GEOM conformation file path when conditioning is enabled.
  # geom_data_file: "/path/to/geom_drugs_30.npy"
  geom_data_file: null
  # Disable novelty filtering by default for GEOM unless you have prepared a SMILES pickle.
  smiles_path: null

filters:
  condition: false
  enable_filtering: false
  enable_penalty: false
  penalty_scale: 0.5
  # Optional: penalize duplicates across recent rollouts (history-based).
  # Set `history_size>0` to keep a rolling SMILES buffer and apply
  # `history_penalty_scale` when a sample repeats within that window.
  history_size: 0
  history_penalty_scale: 0.0
  # Optional: scale the history penalty by how often a SMILES appears in the
  # rolling buffer. Options:
  # - constant (default): fixed penalty per repeated SMILES
  # - log: log2-scaled penalty (count=1 -> multiplier 1, count=2 -> ~1.585)
  # - sqrt: sqrt(count)-scaled penalty
  # - linear: count-scaled penalty
  history_penalty_mode: constant
  # Optional cap on the history penalty multiplier (null disables capping).
  history_penalty_max_multiplier: null

model:
  backend: auto
  config: "./pretrained/edm/edm_geom_drugs/args.pickle"
  model_path: "./pretrained/edm/edm_geom_drugs/generative_model_ema.npy"
  time_step: 1000
  share_initial_noise: false

train:
  adv_clip_max: 5
  max_grad_norm: 1
  learning_rate: 0.000005
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 0.0001
  adam_epsilon: 0.00000001
  clip_range: 0.15
  kl_penalty_weight: 0.0
  # Optional: adaptive KL control. When enabled, the actor scales `kl_penalty_weight`
  # to keep `kl_loss` near `kl_target` (with hysteresis).
  kl_target: null
  kl_adaptive: false
  kl_adaptive_hysteresis: 1.5
  kl_adaptive_factor: 1.5
  kl_penalty_weight_min: 0.0
  kl_penalty_weight_max: 1.0
  train_micro_batch_size: 256
  gradient_accumulation_steps: 1
  force_alignment_enabled: true
  epoch_per_rollout: 1
  force_alignment_weight: 0.5
  force_alignment_min_force: 0.0001
  force_alignment_min_delta: 0.0001
  scheduler:
    name: cosine
    warmup_steps: 10
    total_steps: 150
    min_lr_ratio: 0.05
    num_cycles: 0.5
    stable_ratio: 0.9

reward:
  type: polar_mace
  mlff_model: polar-1-m
  mlff_backend: polar_mace
  mlff_charge: 0
  mlff_spin: 1
  mlff_external_field: [0.0, 0.0, 0.0]
  mlff_default_dtype: float32
  force_clip_threshold: null
  use_energy: false
  force_weight: 1.0
  energy_weight: 1.0
  stability_weight: 0.0
  force_aggregation: rms
  force_adv_weight: 1.0
  energy_adv_weight: 0.1
  energy_transform_offset: 10000.0
  energy_transform_scale: 1000.0
  shaping:
    enabled: true
    gamma: 1.0
    only_energy_reshape: false
    mlff_batch_size: 32
    terminal_weight: 5
    scheduler:
      mode: adaptive
      skip_prefix: 500
      uniform_stride: 1
      include_terminal: true
      adaptive:
        coarse_stride: 10
        fine_stride: 2
        threshold_fraction: 0.25

wandb:
  enabled: false
  wandb_project: "ddpo"
  wandb_name: "edm-geom-ddp"

hydra:
  job:
    chdir: false
